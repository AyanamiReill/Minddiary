name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # 使用最通用的标签

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # 升级到 18，兼容性更好

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          # 针对新版 Mac 环境的修复
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          # 关键：由于没有签名，我们只编译出 .app 文件
          xcodebuild -workspace ios/Minddiary.xcworkspace \
            -scheme Minddiary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # 自动寻找编译生成的 .app 文件夹
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
