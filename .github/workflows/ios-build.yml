name: Build iOS IPA (Full Dependency Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 使用 Expo 推荐的稳定版 20

      - name: Force Install Dependencies
        run: |
          # 1. 彻底清空并重新安装核心依赖
          npm install --legacy-peer-deps
          # 2. 显式地安装 react-native 和 expo，确保它们出现在 node_modules 里
          npm install react-native expo --legacy-peer-deps

      - name: Prebuild iOS Project
        run: |
          # 3. 生成 ios 目录
          npx expo prebuild --platform ios --no-install --non-interactive

      - name: Debug Node Modules (Optional)
        run: |
          # 检查 react-native 是否真的存在，方便报错时排查
          ls node_modules/react-native/package.json || echo "React Native NOT FOUND!"

      - name: Install CocoaPods
        run: |
          # 4. 进入 ios 目录安装，并告诉系统到上级目录找 node_modules
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          PROJECT_NAME=$(ls ios | grep .xcodeproj | cut -f 1 -d '.')
          xcodebuild -workspace ios/$PROJECT_NAME.xcworkspace \
            -scheme $PROJECT_NAME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
