name: Build iOS IPA (Expo Prebuild)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild iOS Project
        run: |
          # Expo 项目需要先生成 ios 文件夹
          # 我们在这里手动注入一个 Bundle ID，否则 prebuild 会失败
          npx expo prebuild --platform ios --no-install --template blank

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          # 自动获取生成的项目名称并编译
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme $(ls ios | grep .xcodeproj | cut -f 1 -d '.') \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
