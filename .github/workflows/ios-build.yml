name: Build iOS IPA (Node 22 Edition)

on:
  workflow_dispatch: # 仅手动触发，避免每次 Commit 都乱跑

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 提升到 Node 22，彻底解决 styleText 报错

      - name: Install Dependencies
        run: |
          # 强制安装 expo 以确保 prebuild 脚本能运行
          npm install --legacy-peer-deps

      - name: Prebuild iOS Project
        run: |
          # 运行 prebuild 前先确保有 expo
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          PROJECT_NAME=$(ls ios | grep .xcodeproj | cut -f 1 -d '.')
          xcodebuild -workspace ios/$PROJECT_NAME.xcworkspace \
            -scheme $PROJECT_NAME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
