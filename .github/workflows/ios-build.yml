name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # 强制使用 macOS 13，因为它自带的 Xcode 14/15 对旧项目更友好

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          # 修复一些旧版 RN 在新环境下的 Ruby 兼容性问题
          gem install cocoapods
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          xcodebuild -workspace ios/Minddiary.xcworkspace \
            -scheme Minddiary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_METHOD=manual \
            OTHER_LDFLAGS='$(inherited) -Wl,-weak_reference_mismatches,privileged' \
            | xcpretty || true
          # 使用 xcpretty 格式化输出，如果失败了也继续，方便我们看 Payload 里的情况

      - name: Check if App exists
        run: |
          ls -R build/Build/Products/Release-iphoneos/

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # 找到生成的 .app 并复制
          find build/Build/Products/Release-iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
