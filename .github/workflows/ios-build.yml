name: Build iOS IPA (Expo Modules Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force Install Dependencies
        run: |
          # 1. 安装基础依赖
          npm install --legacy-peer-deps
          # 2. 强制安装 Expo 核心模块，这是解决 EXNativeModulesProxy.h 缺失的关键
          npm install expo expo-modules-core react-native --legacy-peer-deps

      - name: Prebuild iOS Project
        run: |
          # 3. 在生成前清理，确保生成的是最新的 Expo 结构
          # 强制指定名称，防止自动识别出错
          npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        run: |
          # 4. 进入 ios 目录，强制更新并安装
          cd ios
          # 这一步非常重要：确保所有的 Expo 模块都能找到
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          # 5. 获取项目名称
          PROJECT_NAME=$(ls ios | grep .xcodeproj | cut -f 1 -d '.')
          echo "Building project: $PROJECT_NAME"
          
          # 6. 使用更加宽松的编译选项，跳过一些严格的路径检查
          xcodebuild -workspace ios/$PROJECT_NAME.xcworkspace \
            -scheme $PROJECT_NAME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            HEADER_SEARCH_PATHS='$(inherited) "${node_modules}/expo-modules-core/ios/**"' \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # 寻找编译出的 .app 文件夹
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
