name: Build iOS IPA (Force Expo Install)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          # 1. 先安装基础依赖
          npm install --legacy-peer-deps
          # 2. 强制把 expo 装进 node_modules，解决 "Cannot determine SDK version"
          npm install expo@latest --legacy-peer-deps

      - name: Prebuild iOS Project
        run: |
          # 3. 强制注入一个 Bundle ID，这是 iOS 编译必须的身份证号
          # 我们直接用 npx expo prebuild，它会自动补齐缺少的 ios 文件夹
          npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        run: |
          cd ios
          # 检查是否有 Podfile，如果没有则报错，方便排查
          if [ ! -f "Podfile" ]; then echo "Podfile not found!"; exit 1; fi
          pod install --repo-update
          cd ..

      - name: Build iOS App
        run: |
          # 4. 自动寻找项目名称并进行 Release 编译
          PROJECT_NAME=$(ls ios | grep .xcodeproj | cut -f 1 -d '.')
          xcodebuild -workspace ios/$PROJECT_NAME.xcworkspace \
            -scheme $PROJECT_NAME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_METHOD=manual \
            -quiet

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Minddiary_unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Minddiary_unsigned.ipa
          retention-days: 1
